services:
  - type: web
    name: gmail-digest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: COOKIE_SECURE
        value: "1"
