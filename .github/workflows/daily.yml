name: Resumo diário privado
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *' # 08h17 em Brasília (UTC-3)
permissions:
  contents: read
jobs:
  digest:
    # Nunca processe e-mails reais em um repositório público.
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python digest.py
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: resumo-gmail
          path: output/resumo.md
          retention-days: 1
